<style>
  :root{ --bg:#f3e3cb; --card:#fffaf2; --ink:#3a2f26; --sub:#7d6c5c; --accent:#5c8f4a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif;
       min-height:100vh;display:flex;justify-content:center;align-items:flex-start;

  h1{font-size:20px;margin:14px 0 4px}
  p{color:var(--sub);font-size:14px;line-height:1.7;margin:0 0 18px}
  ol{text-align:left;font-size:15px;line-height:1.8;padding-left:1.4em;margin:0 0 20px}
  ol b{color:var(--ink)}
  .open{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:12px}

  <div class="card">
